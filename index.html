<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depth 2.5D — turn a photo into a 3D view</title>
<meta name="description" content="Turn a single image into a moving 2.5D/3D view in your browser. Depth Anything V2 runs locally; your images never leave your device.">
<style>
  :root { --bg:#0e0f12; --panel:#17191e; --line:#2a2d35; --txt:#e6e6e6; --dim:#9aa0aa; --acc:#4fa3ff; --warn:#ffb347; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui,Segoe UI,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; touch-action:none; }
  #stage canvas { display:block; width:100%; height:100%; }
  #panel { position:fixed; top:12px; right:12px; width:270px; max-height:calc(100% - 24px); overflow:auto;
           background:rgba(23,25,30,.94); border:1px solid var(--line); border-radius:10px; padding:12px 14px; z-index:5; }
  #panel.hidden { display:none; }
  h1 { font-size:14px; margin:0 0 10px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  #lang { width:auto; margin:0; padding:2px 8px; font-size:11px; }
  label { display:block; margin:9px 0 2px; color:var(--dim); }
  label b { color:var(--txt); font-weight:500; float:right; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  select, button { width:100%; background:#22252c; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  button { cursor:pointer; margin-top:8px; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#06121f; border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  .chk { display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--dim); }
  .chk input { accent-color:var(--acc); }
  hr { border:0; border-top:1px solid var(--line); margin:12px 0 4px; }
  .hint { color:var(--dim); font-size:11.5px; margin-top:10px; }
  .note { color:var(--warn); font-size:11.5px; margin-top:6px; }
  #drop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; pointer-events:none; z-index:2; }
  #drop.over { display:flex; }
  #drop div { border:2px dashed var(--acc); border-radius:16px; padding:40px 56px; color:var(--txt); font-size:15px; background:rgba(14,15,18,.7); }
  #status { position:fixed; left:12px; bottom:12px; background:rgba(23,25,30,.92); border:1px solid var(--line); border-radius:8px;
            padding:7px 11px; z-index:5; max-width:min(60%, 420px); }
  #status:empty { display:none; }
  #bar { height:3px; background:var(--acc); width:0; margin-top:5px; border-radius:2px; transition:width .15s; }
  #toggle { position:fixed; top:12px; right:12px; z-index:4; width:auto; margin:0; display:none; }
  #demoTag { position:fixed; left:12px; top:12px; z-index:4; background:rgba(23,25,30,.85); border:1px solid var(--line);
             border-radius:20px; padding:4px 11px; color:var(--dim); font-size:12px; display:none; }
  .rec { color:#ff6b6b; }
  /* uyari penceresi */
  #gate { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px;
          background:rgba(8,9,11,.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  #gate.gone { display:none; }
  #gate .box { max-width:440px; width:100%; max-height:calc(100% - 8px); overflow:auto; background:var(--panel); border:1px solid var(--line);
               border-radius:14px; padding:20px 22px; box-shadow:0 20px 60px rgba(0,0,0,.5); font-size:14px; }
  #gate h2 { margin:0 0 10px; font-size:17px; color:var(--warn); }
  #gate p { margin:8px 0; color:#cfd3da; }
  #gate ul { margin:8px 0; padding-left:20px; color:#cfd3da; }
  #gate li { margin:4px 0; }
  #gate .langs { display:flex; gap:6px; justify-content:flex-end; margin-bottom:4px; }
  #gate .langs button { width:auto; margin:0; padding:2px 9px; font-size:11px; }
  #gate .ok { margin-top:14px; padding:10px; font-size:15px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="drop"><div data-i="drop"></div></div>
<div id="demoTag" data-i="demoTag"></div>
<button id="toggle" data-i="settings"></button>

<div id="gate">
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="langs"><button data-l="tr">TR</button><button data-l="en">EN</button></div>
    <h2 id="gateTitle" data-i="gateTitle"></h2>
    <p data-i="gateP1"></p>
    <ul>
      <li data-i="gateL1"></li>
      <li data-i="gateL2"></li>
      <li data-i="gateL3"></li>
    </ul>
    <p data-i="gateP2"></p>
    <button id="gateOk" class="primary ok" data-i="gateOk"></button>
  </div>
</div>

<div id="panel">
  <h1><span data-i="title"></span><button id="lang"></button></h1>
  <button id="pick" class="primary" data-i="pick"></button>
  <input id="file" type="file" accept="image/*" hidden>
  <div class="note" data-i="dataNote"></div>

  <hr>
  <label data-i="motion"></label>
  <select id="mode">
    <option value="mouse" data-i="mMouse"></option>
    <option value="orbit" data-i="mOrbit"></option>
    <option value="circle" data-i="mCircle"></option>
    <option value="sway" data-i="mSway"></option>
    <option value="vsway" data-i="mVsway"></option>
    <option value="dolly" data-i="mDolly" selected></option>
  </select>

  <label><span data-i="depthStr"></span> <b id="v_depth"></b></label>
  <input id="depth" type="range" min="0.1" max="6" step="0.05" value="1.5">
  <label><span data-i="focus"></span> <b id="v_focus"></b></label>
  <input id="focus" type="range" min="0" max="1" step="0.01" value="0.55">
  <label><span data-i="amp"></span> <b id="v_amp"></b></label>
  <input id="amp" type="range" min="0" max="0.35" step="0.005" value="0.07">
  <label><span data-i="period"></span> <b id="v_period"></b></label>
  <input id="period" type="range" min="2" max="20" step="0.5" value="6">

  <hr>
  <label><span data-i="smooth"></span> <b id="v_smooth"></b></label>
  <input id="smooth" type="range" min="0" max="8" step="0.25" value="1.25">
  <div class="chk"><input id="tear" type="checkbox" checked><span data-i="tear"></span></div>
  <label><span data-i="edge"></span> <b id="v_edge"></b></label>
  <input id="edge" type="range" min="0.01" max="0.4" step="0.005" value="0.05">
  <label><span data-i="over"></span> <b id="v_over"></b></label>
  <input id="over" type="range" min="0" max="0.3" step="0.005" value="0.06">
  <div class="chk"><input id="showDepth" type="checkbox"><span data-i="showDepth"></span></div>

  <hr>
  <button id="rec" disabled data-i="rec"></button>
  <div class="row">
    <button id="dlDepth" disabled data-i="dlDepth"></button>
    <button id="fs" data-i="fs"></button>
  </div>
  <div class="hint" data-i="hint"></div>
</div>

<div id="status"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js';
const MODEL_ID  = 'onnx-community/depth-anything-v2-small';
const COARSE    = matchMedia('(pointer: coarse)').matches;
const DEPTH_MAX = 1024;               // derinlik tahmini icin gorselin uzun kenari
const COLOR_MAX = COARSE ? 1600 : 2048;
const MESH_MAX  = COARSE ? 420 : 640; // ag cozunurlugu (uzun kenar)
const FOV_DEG   = 50;

// ---------- dil ----------
const L = {
  tr: {
    title: 'Derinlik 2.5D', settings: '☰ Ayarlar', pick: 'Kendi görselini seç…',
    dataNote: 'İlk kendi görselinde ~100 MB model indirilir.',
    drop: 'Görseli bırak', demoTag: 'Örnek görsel · kendi görselini yükleyebilirsin',
    motion: 'Hareket', mMouse: 'Fare / parmak ile bak', mOrbit: 'Serbest döndür (sürükle)', mCircle: 'Otomatik: daire',
    mSway: 'Otomatik: yatay salınım', mVsway: 'Otomatik: dikey salınım', mDolly: 'Otomatik: yaklaş-uzaklaş',
    depthStr: 'Derinlik gücü', focus: 'Odak (sabit kalan derinlik)', amp: 'Hareket miktarı', period: 'Döngü süresi (sn)',
    smooth: 'Derinlik yumuşatma', tear: 'Kenarları ayır (insan/arka plan esnemesin)', edge: 'Ayırma eşiği',
    over: 'Kenar payı (yakınlaştırma)', showDepth: 'Derinlik haritasını göster',
    rec: '● Video kaydet (1 döngü)', dlDepth: 'Derinlik PNG', fs: 'Tam ekran',
    hint: 'H: paneli gizle/göster · F: tam ekran · Çift tık: görünümü sıfırla.<br>Görsel seçmek yerine sürükle-bırak veya Ctrl+V da olur. Görsellerin cihazından çıkmaz; derinlik tarayıcında hesaplanır.',
    gateTitle: '⚠ Veri kullanımı uyarısı',
    gateP1: 'Bu sayfa tek bir görselden hareketli 2.5D/3B görünüm üretir. Şu an açılan örnek görsel hafiftir (~2 MB).',
    gateL1: '<b>Kendi görselini işlediğinde</b> derinlik modeli (Depth Anything V2 Small, <b>~100 MB</b>) ve çalıştırma kütüphaneleri (~20 MB) bir kez indirilir.',
    gateL2: '<b>Telefonda mobil veriyle</b> bağlıysan bu, kotandan yemek demek. Mümkünse Wi-Fi kullan.',
    gateL3: 'Sonraki kullanımlarda model tarayıcı önbelleğinden gelir; tekrar indirilmez. Görsellerin hiçbir sunucuya gönderilmez.',
    gateP2: 'Telefonlarda işlem birkaç saniyeden bir dakikaya kadar sürebilir.',
    gateOk: 'Anladım, onaylıyorum',
    stLib: 'Kütüphane yükleniyor…', stDl: (a, b) => `Model indiriliyor… ${a} / ${b} MB`, stCalc: d => `Derinlik hesaplanıyor (${d})…`,
    stReady: (w, h, s, d) => `Hazır · derinlik ${w}×${h} · ${s} sn (${d})`, stFail: 'Derinlik çıkarılamadı: ',
    stDemoFail: 'Örnek görsel yüklenemedi; kendi görselini seçebilirsin.',
    stNoRec: 'Bu tarayıcı video kaydını desteklemiyor.', stRec: (el, p) => `● Kaydediliyor… ${el} / ${p} sn`,
    stSaved: (w, h, e) => `Video kaydedildi (${w}×${h}, ${e}). Tam döngü olduğu için sorunsuz tekrar eder.`,
  },
  en: {
    title: 'Depth 2.5D', settings: '☰ Settings', pick: 'Choose your own image…',
    dataNote: 'Your first own image downloads a ~100 MB model.',
    drop: 'Drop the image', demoTag: 'Sample image · load your own anytime',
    motion: 'Motion', mMouse: 'Look with mouse / finger', mOrbit: 'Free rotate (drag)', mCircle: 'Auto: circle',
    mSway: 'Auto: horizontal sway', mVsway: 'Auto: vertical sway', mDolly: 'Auto: dolly in-out',
    depthStr: 'Depth strength', focus: 'Focus (depth that stays still)', amp: 'Motion amount', period: 'Loop length (s)',
    smooth: 'Depth smoothing', tear: 'Split edges (no stretching between subject and background)', edge: 'Split threshold',
    over: 'Edge margin (zoom)', showDepth: 'Show depth map',
    rec: '● Record video (1 loop)', dlDepth: 'Depth PNG', fs: 'Fullscreen',
    hint: 'H: hide/show panel · F: fullscreen · Double-click: reset view.<br>You can also drag-and-drop or paste (Ctrl+V). Images never leave your device; depth is computed in your browser.',
    gateTitle: '⚠ Data usage warning',
    gateP1: 'This page turns a single image into a moving 2.5D/3D view. The sample image opening now is light (~2 MB).',
    gateL1: '<b>When you process your own image</b>, the depth model (Depth Anything V2 Small, <b>~100 MB</b>) and runtime libraries (~20 MB) are downloaded once.',
    gateL2: '<b>On a phone using mobile data</b>, this will eat into your data plan. Use Wi-Fi if you can.',
    gateL3: 'After that the model comes from your browser cache and is not downloaded again. Your images are never sent to any server.',
    gateP2: 'On phones, processing can take from a few seconds up to a minute.',
    gateOk: 'I understand, continue',
    stLib: 'Loading library…', stDl: (a, b) => `Downloading model… ${a} / ${b} MB`, stCalc: d => `Estimating depth (${d})…`,
    stReady: (w, h, s, d) => `Ready · depth ${w}×${h} · ${s} s (${d})`, stFail: 'Could not estimate depth: ',
    stDemoFail: 'Sample image could not be loaded; you can choose your own image.',
    stNoRec: 'This browser does not support video recording.', stRec: (el, p) => `● Recording… ${el} / ${p} s`,
    stSaved: (w, h, e) => `Video saved (${w}×${h}, ${e}). It is a full loop, so it repeats seamlessly.`,
  },
};
let lang = (() => {
  try { const s = localStorage.getItem('d25_lang'); if (s === 'tr' || s === 'en') return s; } catch {}
  return (navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en';
})();
const T = k => L[lang][k];
function applyLang() {
  document.documentElement.lang = lang;
  document.title = lang === 'tr' ? 'Derinlik 2.5D — görselden 3B görünüm' : 'Depth 2.5D — turn a photo into a 3D view';
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = T(el.dataset.i); });
  $('lang').textContent = lang === 'tr' ? 'EN' : 'TR';
}
function setLang(l) { lang = l; try { localStorage.setItem('d25_lang', l); } catch {} applyLang(); }

const $ = id => document.getElementById(id);
const ui = {};
['depth','focus','amp','period','smooth','edge','over','mode','tear','showDepth'].forEach(k => ui[k] = $(k));
applyLang();
$('lang').addEventListener('click', () => setLang(lang === 'tr' ? 'en' : 'tr'));
document.querySelectorAll('#gate [data-l]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));

// ---------- uyari penceresi: onaylanmadan hicbir etkilesim yok ----------
let accepted = false;
$('gateOk').addEventListener('click', () => {
  accepted = true;
  $('gate').classList.add('gone');
  if (COARSE || innerWidth < 700) togglePanel(true);
});

// ---------- durum cubugu ----------
const statusEl = $('status');
function setStatus(msg, pct) {
  if (!msg) { statusEl.innerHTML = ''; return; }
  statusEl.innerHTML = msg + (pct != null ? `<div id="bar" style="width:${Math.round(pct)}%"></div>` : '');
}

// ---------- three.js sahnesi ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0e0f12, 1);
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV_DEG, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enabled = false;
controls.rotateSpeed = 0.35; controls.enablePan = false;
controls.minAzimuthAngle = -0.5; controls.maxAzimuthAngle = 0.5;
controls.minPolarAngle = Math.PI / 2 - 0.4; controls.maxPolarAngle = Math.PI / 2 + 0.4;

const vert = /* glsl */`
  uniform sampler2D dMap;
  uniform float invNear, invFar, tanHalf, aspect;
  uniform vec2 step;
  varying vec2 vUv;
  varying float vEdge;
  varying float vD;
  float zAt(vec2 uv) {
    float d = texture2D(dMap, uv).r;
    return 1.0 / (d * (invNear - invFar) + invFar);
  }
  void main() {
    vUv = uv;
    vD = texture2D(dMap, uv).r;
    float z = zAt(uv);
    float zl = zAt(uv - vec2(step.x, 0.0)), zr = zAt(uv + vec2(step.x, 0.0));
    float zd = zAt(uv - vec2(0.0, step.y)), zu = zAt(uv + vec2(0.0, step.y));
    float mx = max(max(zl, zr), max(zd, zu)), mn = min(min(zl, zr), min(zd, zu));
    vEdge = (mx - mn) / z;
    vec2 ndc = uv * 2.0 - 1.0;
    vec3 p = vec3(ndc.x * tanHalf * aspect * z, ndc.y * tanHalf * z, -z);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }`;
const frag = /* glsl */`
  uniform sampler2D map;
  uniform float edgeThr;
  uniform bool tear, showDepth;
  varying vec2 vUv;
  varying float vEdge;
  varying float vD;
  vec3 turbo(float x) {
    x = clamp(x, 0.0, 1.0);
    vec4 kR = vec4(0.13572138, 4.61539260, -42.66032258, 132.13108234);
    vec4 kG = vec4(0.09140261, 2.19418839, 4.84296658, -14.18503333);
    vec4 kB = vec4(0.10667330, 12.64194608, -60.58204836, 110.36276771);
    vec2 kR2 = vec2(-152.94239396, 59.28637943), kG2 = vec2(4.27729857, 2.82956604), kB2 = vec2(-89.90310912, 27.34824973);
    vec4 v4 = vec4(1.0, x, x*x, x*x*x); vec2 v2 = v4.zw * v4.z;
    return vec3(dot(v4,kR)+dot(v2,kR2), dot(v4,kG)+dot(v2,kG2), dot(v4,kB)+dot(v2,kB2));
  }
  void main() {
    if (tear && vEdge > edgeThr) discard;
    vec3 c = showDepth ? pow(max(turbo(vD), 0.0), vec3(2.2)) : texture2D(map, vUv).rgb;
    gl_FragColor = vec4(c, 1.0);
    #include <colorspace_fragment>
  }`;

function makeMaterial() {
  return new THREE.ShaderMaterial({
    vertexShader: vert, fragmentShader: frag,
    uniforms: {
      dMap: { value: null }, map: { value: null },
      invNear: { value: 1 }, invFar: { value: 0.5 },
      tanHalf: { value: Math.tan(THREE.MathUtils.degToRad(FOV_DEG / 2)) },
      aspect: { value: 1 }, step: { value: new THREE.Vector2(0.001, 0.001) },
      edgeThr: { value: 0.05 }, tear: { value: true }, showDepth: { value: false },
    },
  });
}
const frontMat = makeMaterial();
const backMat = makeMaterial();          // kenarlar ayrilinca acilan bosluklari dolduran arka katman
backMat.uniforms.tear.value = false;
let frontMesh = null, backMesh = null;
let recording = false, recStart = 0;

// ---------- veri ----------
let img = null;          // { w, h, aspect, name }
let depthRaw = null;     // Float32Array, 0..1, 1 = yakin, satir 0 = ust
let dW = 0, dH = 0;
let colorTex = null, blurTex = null;
let loadSeq = 0;

function setImage(src, name) {
  const color = scaledCanvas(src, COLOR_MAX);
  const small = scaledCanvas(src, DEPTH_MAX);
  img = { w: src.width, h: src.height, aspect: src.width / src.height, name };
  colorTex?.dispose(); blurTex?.dispose();
  colorTex = new THREE.CanvasTexture(color);
  colorTex.colorSpace = THREE.SRGBColorSpace;
  colorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const bc = document.createElement('canvas'); bc.width = small.width; bc.height = small.height;
  const bx = bc.getContext('2d'); bx.filter = `blur(${Math.round(small.width / 90)}px)`; bx.drawImage(small, 0, 0);
  blurTex = new THREE.CanvasTexture(bc); blurTex.colorSpace = THREE.SRGBColorSpace;
  return small;
}

// ---------- ornek gorsel: derinlik onceden hesaplandi, model indirilmez ----------
async function loadDemo() {
  try {
    const [cb, db] = await Promise.all(['demo.jpg', 'demo_depth.png'].map(async u => {
      const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.blob();
    }));
    const bmp = await createImageBitmap(cb);
    const dbmp = await createImageBitmap(db, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
    const c = document.createElement('canvas'); c.width = dbmp.width; c.height = dbmp.height;
    const cx = c.getContext('2d', { willReadFrequently: true }); cx.drawImage(dbmp, 0, 0);
    const px = cx.getImageData(0, 0, c.width, c.height).data;
    const data = new Float32Array(c.width * c.height);
    for (let i = 0; i < data.length; i++) data[i] = (px[i * 4] * 256 + px[i * 4 + 1]) / 65535;
    if (img) return;                       // kullanici bu arada kendi gorselini yukledi
    setImage(bmp, 'demo');
    dW = c.width; dH = c.height; depthRaw = data;
    rebuild();
    $('demoTag').style.display = 'block';
    $('rec').disabled = false; $('dlDepth').disabled = false;
  } catch (e) {
    console.error(e);
    setStatus(T('stDemoFail'));
  }
}

// ---------- kendi gorseli ----------
async function loadFile(file) {
  if (!accepted || !file || !file.type.startsWith('image/')) return;
  const seq = ++loadSeq;
  const bmp = await createImageBitmap(file);
  $('demoTag').style.display = 'none';
  const small = setImage(bmp, file.name || 'image');
  dW = 2; dH = 2; depthRaw = new Float32Array([0.5, 0.5, 0.5, 0.5]);
  $('rec').disabled = true; $('dlDepth').disabled = true;
  rebuild();
  try {
    const t0 = performance.now();
    const res = await estimateDepth(small);
    if (seq !== loadSeq) return;
    dW = res.w; dH = res.h; depthRaw = res.data;
    rebuild();
    setStatus(T('stReady')(dW, dH, ((performance.now() - t0) / 1000).toFixed(1), device.toUpperCase()));
    setTimeout(() => setStatus(''), 4000);
    $('rec').disabled = false; $('dlDepth').disabled = false;
  } catch (e) {
    console.error(e);
    setStatus(T('stFail') + (e.message || e));
  }
}

function scaledCanvas(src, maxSide) {
  const s = Math.min(1, maxSide / Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(src.width * s)); c.height = Math.max(2, Math.round(src.height * s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

// ---------- derinlik tahmini (transformers.js, tarayicida) ----------
let tf = null, estimator = null, device = 'wasm';
async function getEstimator() {
  if (estimator) return estimator;
  if (!tf) {
    setStatus(T('stLib'));
    tf = await import(TRANSFORMERS_URL);
    tf.env.allowLocalModels = false;
  }
  const files = {};
  const progress = p => {
    if (p.status === 'progress' && p.total) {
      files[p.file] = [p.loaded, p.total];
      let a = 0, b = 0; for (const k in files) { a += files[k][0]; b += files[k][1]; }
      setStatus(T('stDl')((a / 1048576).toFixed(0), (b / 1048576).toFixed(0)), 100 * a / b);
    }
  };
  device = 'wasm';
  if (navigator.gpu) {
    try { const adapter = await navigator.gpu.requestAdapter(); if (adapter) device = 'webgpu'; } catch {}
  }
  try {
    estimator = await tf.pipeline('depth-estimation', MODEL_ID, { device, dtype: 'fp32', progress_callback: progress });
  } catch (e) {
    if (device === 'webgpu') {
      console.warn('WebGPU failed, trying WASM', e);
      device = 'wasm';
      estimator = await tf.pipeline('depth-estimation', MODEL_ID, { device, dtype: 'fp32', progress_callback: progress });
    } else throw e;
  }
  return estimator;
}

async function estimateDepth(canvas) {
  const est = await getEstimator();
  setStatus(T('stCalc')(device.toUpperCase()));
  await new Promise(r => setTimeout(r, 30));
  const out = await est(canvas.toDataURL('image/png'));
  const t = out.predicted_depth;
  const [h, w] = t.dims.slice(-2);
  const src = t.data;
  const sample = [];
  const stride = Math.max(1, Math.floor(src.length / 200000));
  for (let i = 0; i < src.length; i += stride) sample.push(src[i]);
  sample.sort((a, b) => a - b);
  const lo = sample[Math.floor(sample.length * 0.005)], hi = sample[Math.floor(sample.length * 0.995)];
  const data = new Float32Array(w * h), k = 1 / Math.max(1e-6, hi - lo);
  for (let i = 0; i < data.length; i++) data[i] = Math.min(1, Math.max(0, (src[i] - lo) * k));
  return { w, h, data };
}

// ---------- derinlik isleme ----------
function gaussBlur(src, w, h, sigma) {
  if (sigma <= 0.01) return src.slice();
  const r = Math.ceil(sigma * 3), ker = new Float32Array(2 * r + 1);
  let s = 0; for (let i = -r; i <= r; i++) { ker[i + r] = Math.exp(-(i * i) / (2 * sigma * sigma)); s += ker[i + r]; }
  for (let i = 0; i < ker.length; i++) ker[i] /= s;
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let a = 0;
      for (let i = -r; i <= r; i++) { const xx = x + i < 0 ? 0 : x + i >= w ? w - 1 : x + i; a += src[row + xx] * ker[i + r]; }
      tmp[row + x] = a;
    }
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      let a = 0;
      for (let i = -r; i <= r; i++) { const yy = y + i < 0 ? 0 : y + i >= h ? h - 1 : y + i; a += tmp[yy * w + x] * ker[i + r]; }
      out[y * w + x] = a;
    }
  }
  return out;
}
function minFilter(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let m = 1; const x0 = Math.max(0, x - r), x1 = Math.min(w - 1, x + r);
    for (let xx = x0; xx <= x1; xx++) { const v = src[y * w + xx]; if (v < m) m = v; }
    tmp[y * w + x] = m;
  }
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) {
    let m = 1; const y0 = Math.max(0, y - r), y1 = Math.min(h - 1, y + r);
    for (let yy = y0; yy <= y1; yy++) { const v = tmp[yy * w + x]; if (v < m) m = v; }
    out[y * w + x] = m;
  }
  return out;
}
// half-float doku: dogrusal filtreleme mobil GPU'larda da desteklenir (float32 desteklenmeyebilir)
function toTexture(arr, w, h) {
  const half = new Uint16Array(w * h);
  for (let y = 0; y < h; y++) {
    const s = (h - 1 - y) * w, d = y * w;           // GPU'da v=0 alt satir
    for (let x = 0; x < w; x++) half[d + x] = THREE.DataUtils.toHalfFloat(arr[s + x]);
  }
  const t = new THREE.DataTexture(half, w, h, THREE.RedFormat, THREE.HalfFloatType);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  return t;
}

let frontDepth = null, backDepth = null;
function rebuildDepth() {
  if (!depthRaw) return;
  const sm = gaussBlur(depthRaw, dW, dH, +ui.smooth.value * (dW / 512));
  frontDepth?.dispose(); backDepth?.dispose();
  frontDepth = toTexture(sm, dW, dH);
  const r = Math.max(1, Math.round(dW / 40));
  backDepth = toTexture(gaussBlur(minFilter(sm, dW, dH, r), dW, dH, r * 0.6), dW, dH);
  frontMat.uniforms.dMap.value = frontDepth;
  backMat.uniforms.dMap.value = backDepth;
}

function rebuild() {
  if (!img) return;
  rebuildDepth();
  const segX = Math.round(img.aspect >= 1 ? MESH_MAX : MESH_MAX * img.aspect);
  const segY = Math.round(img.aspect >= 1 ? MESH_MAX / img.aspect : MESH_MAX);
  const geo = new THREE.PlaneGeometry(1, 1, segX, segY);
  if (frontMesh) { scene.remove(frontMesh, backMesh); frontMesh.geometry.dispose(); }
  frontMesh = new THREE.Mesh(geo, frontMat); frontMesh.frustumCulled = false;
  backMesh = new THREE.Mesh(geo, backMat); backMesh.frustumCulled = false;
  backMesh.renderOrder = -1;
  scene.add(backMesh, frontMesh);
  for (const m of [frontMat, backMat]) {
    m.uniforms.aspect.value = img.aspect;
    m.uniforms.step.value.set(1 / segX, 1 / segY);
  }
  frontMat.uniforms.map.value = colorTex;
  backMat.uniforms.map.value = blurTex;
  applyParams();
  resetView();
}

// ---------- parametreler ----------
const zFar = () => 1 + +ui.depth.value;
const zFromD = d => { const zf = zFar(); return 1 / (d * (1 - 1 / zf) + 1 / zf); };
function applyParams() {
  const fmt = { depth: v => (+v).toFixed(2), focus: v => (+v).toFixed(2), amp: v => (+v).toFixed(3), period: v => v,
                smooth: v => v, edge: v => (+v).toFixed(3), over: v => Math.round(v * 100) + '%' };
  for (const k in fmt) $('v_' + k).textContent = fmt[k](ui[k].value);
  for (const m of [frontMat, backMat]) {
    m.uniforms.invNear.value = 1;
    m.uniforms.invFar.value = 1 / zFar();
    m.uniforms.showDepth.value = ui.showDepth.checked;
  }
  frontMat.uniforms.edgeThr.value = +ui.edge.value;
  frontMat.uniforms.tear.value = ui.tear.checked;
  backMesh && (backMesh.visible = ui.tear.checked);
  const fz = zFromD(+ui.focus.value);
  controls.target.set(0, 0, -fz);
  controls.minDistance = fz * 0.35; controls.maxDistance = fz * 1.6;
  controls.enabled = ui.mode.value === 'orbit' && !recording && accepted;
  updateCameraFov();
}
['depth','focus','amp','period','edge','over','tear','showDepth'].forEach(k => ui[k].addEventListener('input', applyParams));
ui.mode.addEventListener('change', () => { resetView(); applyParams(); });
let smoothTimer = 0;
ui.smooth.addEventListener('input', () => { applyParams(); clearTimeout(smoothTimer); smoothTimer = setTimeout(rebuildDepth, 120); });

// ---------- kamera ----------
let viewAspect = 1;
function updateCameraFov() {
  if (!img) return;
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(FOV_DEG / 2));
  const need = Math.max(tanHalf, tanHalf * img.aspect / viewAspect) / (1 + +ui.over.value);
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(need));
  camera.aspect = viewAspect;
  camera.updateProjectionMatrix();
}
function resetView() {
  camera.position.set(0, 0, 0);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, -zFromD(+ui.focus.value));
  mouse.x = mouse.y = mouse.sx = mouse.sy = 0;
  controls.update?.();
}
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener('pointermove', e => {
  if (!accepted) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1; mouse.y = -((e.clientY / innerHeight) * 2 - 1);
});
renderer.domElement.addEventListener('dblclick', () => { resetView(); applyParams(); });

function motionOffset(mode, phase, amp) {
  const th = phase * Math.PI * 2;
  switch (mode) {
    case 'circle': return [amp * Math.sin(th), amp * 0.6 * Math.cos(th) - amp * 0.6, 0];
    case 'sway':   return [amp * Math.sin(th), 0, 0];
    case 'vsway':  return [0, amp * Math.sin(th), 0];
    case 'dolly':  return [amp * 0.3 * Math.sin(th), 0, -amp * 2.2 * (0.5 - 0.5 * Math.cos(th))];
    default: return [0, 0, 0];
  }
}

// ---------- boyut ----------
function resize() {
  if (recording) return;
  renderer.setSize(innerWidth, innerHeight, false);
  viewAspect = innerWidth / innerHeight;
  updateCameraFov();
}
addEventListener('resize', resize);
resize();

// ---------- dongu ----------
const clockStart = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (!img) { renderer.render(scene, camera); return; }
  const mode = recording && (ui.mode.value === 'mouse' || ui.mode.value === 'orbit') ? 'circle' : ui.mode.value;
  const amp = +ui.amp.value, period = +ui.period.value;
  const focusZ = zFromD(+ui.focus.value);
  if (mode === 'orbit') {
    controls.update();
  } else {
    let o;
    if (mode === 'mouse') {
      mouse.sx += (mouse.x - mouse.sx) * 0.08; mouse.sy += (mouse.y - mouse.sy) * 0.08;
      o = [mouse.sx * amp, mouse.sy * amp * 0.7, 0];
    } else {
      const t = recording ? (now - recStart) / 1000 : (now - clockStart) / 1000;
      o = motionOffset(mode, (t / period) % 1, amp);
    }
    camera.position.set(o[0], o[1], o[2]);
    camera.lookAt(0, 0, -focusZ);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// ---------- video kaydi ----------
$('rec').addEventListener('click', async () => {
  if (recording || !img || !accepted) return;
  const btn = $('rec');
  const long = COARSE ? 1280 : 1920;
  let W = img.aspect >= 1 ? long : Math.round(long * img.aspect);
  let H = img.aspect >= 1 ? Math.round(long / img.aspect) : long;
  W -= W % 2; H -= H % 2;
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!mime) { setStatus(T('stNoRec')); return; }
  recording = true; controls.enabled = false;
  const prevRatio = renderer.getPixelRatio();
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  viewAspect = W / H; updateCameraFov();
  const stream = renderer.domElement.captureStream(60);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16_000_000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  const period = +ui.period.value;
  rec.start(250);
  recStart = performance.now();
  btn.disabled = true; btn.classList.add('rec');
  const tick = setInterval(() => {
    btn.textContent = T('stRec')(((performance.now() - recStart) / 1000).toFixed(1), period);
  }, 100);
  await new Promise(r => setTimeout(r, period * 1000));
  rec.stop(); await done; clearInterval(tick);
  stream.getTracks().forEach(t => t.stop());
  recording = false;
  renderer.setPixelRatio(prevRatio);
  resize(); applyParams();
  btn.disabled = false; btn.classList.remove('rec'); btn.textContent = T('rec');
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  download(new Blob(chunks, { type: mime.split(';')[0] }), `${baseName()}_25d.${ext}`);
  setStatus(T('stSaved')(W, H, ext.toUpperCase()));
  setTimeout(() => setStatus(''), 5000);
});

// ---------- derinlik PNG ----------
$('dlDepth').addEventListener('click', () => {
  if (!depthRaw || dW < 3) return;
  const c = document.createElement('canvas'); c.width = dW; c.height = dH;
  const ctx = c.getContext('2d'), id = ctx.createImageData(dW, dH);
  for (let i = 0; i < depthRaw.length; i++) {
    const v = Math.round(depthRaw[i] * 255);
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  c.toBlob(b => download(b, `${baseName()}_depth.png`), 'image/png');
});

function baseName() { return (img?.name || 'image').replace(/\.[^.]+$/, ''); }
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ---------- girisler ----------
function take(file) { if (accepted && file && file.type.startsWith('image/')) loadFile(file); }
$('pick').addEventListener('click', () => accepted && $('file').click());
$('file').addEventListener('change', e => { take(e.target.files[0]); e.target.value = ''; });
addEventListener('dragover', e => { e.preventDefault(); if (accepted) $('drop').classList.add('over'); });
addEventListener('dragleave', e => { if (e.relatedTarget == null) $('drop').classList.remove('over'); });
addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); take(e.dataTransfer.files[0]); });
addEventListener('paste', e => {
  for (const it of e.clipboardData?.items || []) if (it.type.startsWith('image/')) { take(it.getAsFile()); break; }
});
function togglePanel(forceHide) {
  const p = $('panel');
  if (forceHide === true) p.classList.add('hidden'); else p.classList.toggle('hidden');
  $('toggle').style.display = p.classList.contains('hidden') ? 'block' : 'none';
}
$('toggle').addEventListener('click', () => togglePanel());
function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}); }
$('fs').addEventListener('click', fullscreen);
addEventListener('keydown', e => {
  if (!accepted) return;
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if (e.key === 'h' || e.key === 'H') togglePanel();
  if (e.key === 'f' || e.key === 'F') fullscreen();
});
applyParams();
loadDemo();
</script>
